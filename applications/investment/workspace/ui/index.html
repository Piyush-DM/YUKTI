<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YUKTI — Investment Committee Workspace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">YUKTI</span>
        <span class="brand-context">Investment Committee Workspace</span>
      </div>
      <div class="topbar-meta" id="topbar-meta"></div>
    </header>

    <main class="shell">
      <nav class="register" aria-label="Case register">
        <div class="register-head">
          <h2>Case register</h2>
          <button id="open-case-button" class="primary" type="button">
            Open case
          </button>
        </div>
        <div id="register-list" class="register-list"></div>
      </nav>

      <section class="stage" id="stage" aria-live="polite"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
