<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YUKTI</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body class="chat-body">
    <a href="#thread" class="skip-link">Skip to the conversation</a>

    <header class="chat-top">
      <div class="brand">
        <span class="brand-mark">YUKTI</span>
        <span class="brand-context" id="chat-context">Investment committee</span>
      </div>
      <div class="chat-top-actions">
        <select id="case-picker" aria-label="Case"></select>
        <a id="record-link" class="ghost" href="record.html">Full record</a>
      </div>
    </header>

    <main class="chat-shell">
      <div class="thread" id="thread" aria-live="polite"></div>

      <div class="composer">
        <div class="chips" id="chips"></div>
        <form id="composer-form" class="composer-form">
          <textarea
            id="composer-input"
            rows="1"
            placeholder="Paste a deal memo, or ask about this case…"
            aria-label="Message"
          ></textarea>
          <button class="primary" type="submit" id="composer-send">Send</button>
        </form>
        <p class="composer-note">
          Answers are read from this case's reasoning record, not written for
          you. Figures read from prose are proposals until you accept them.
        </p>
      </div>
    </main>

    <script src="chat.js"></script>
  </body>
</html>
